name: Build and Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permiso necesario para que el GITHUB_TOKEN pueda publicar en la rama gh-pages
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Si tienes paso de build (npm run build), agrégalo aquí
      # - name: Install and build
      #   run: |
      #     npm ci
      #     npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .   # ajusta a ./build si necesitas
